name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux
          - os: windows-latest
            classifier: windows
          - os: macos-latest
            classifier: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - shell: bash
        run: chmod +x gradlew
      - shell: bash
        run: ./gradlew :cli:runtimeZip :cli:test -Pmcfpm.version="${GITHUB_REF_NAME#v}" --no-daemon
      - name: Generate SHA-256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          archive="cli/build/distributions/mcfpm-${GITHUB_REF_NAME#v}-${{ matrix.classifier }}.zip"
          [[ -f "$archive" ]]
          (
            cd "$(dirname "$archive")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$(basename "$archive")"
            else
              shasum -a 256 "$(basename "$archive")"
            fi > "$(basename "$archive").sha256"
          )
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-${{ runner.os }}
          path: cli/build/distributions/*-${{ matrix.classifier }}.zip*
          if-no-files-found: error

  portable-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - shell: bash
        run: chmod +x gradlew
      - shell: bash
        run: ./gradlew :cli:distZip :cli:test -Pmcfpm.version="${GITHUB_REF_NAME#v}" --no-daemon
      - name: Generate SHA-256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(cli/build/distributions/mcfpm-${GITHUB_REF_NAME#v}.zip)
          ((${#archives[@]} == 1))
          archive="${archives[0]}"
          (
            cd "$(dirname "$archive")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$(basename "$archive")"
            else
              shasum -a 256 "$(basename "$archive")"
            fi > "$(basename "$archive").sha256"
          )
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-jvm
          path: cli/build/distributions/mcfpm-*.zip*
          if-no-files-found: error

  release:
    needs: [package, portable-jvm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
