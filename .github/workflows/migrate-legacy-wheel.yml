name: Migrate legacy wheel packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcfpm-legacy-wheel-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted master migration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the workflow actor is an administrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"
          [[ "$permission" == "admin" ]]

      - name: Download and verify the pinned Mcfpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCFPM_RELEASE_REPOSITORY: ${{ vars.MCFPM_RELEASE_REPOSITORY }}
          MCFPM_RELEASE_VERSION: ${{ vars.MCFPM_RELEASE_VERSION }}
          MCFPM_RELEASE_SHA256: ${{ vars.MCFPM_RELEASE_SHA256 }}
        run: |
          set -euo pipefail
          version="${MCFPM_RELEASE_VERSION#v}"
          [[ "$MCFPM_RELEASE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${MCFPM_RELEASE_SHA256,,}" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/mcfpm-${version}-linux.zip"
          gh release download "v${version}" --repo "$MCFPM_RELEASE_REPOSITORY" \
            --pattern "mcfpm-${version}-linux.zip" --dir "$RUNNER_TEMP"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$actual" == "${MCFPM_RELEASE_SHA256,,}" ]]
          unzip -q "$archive" -d "$RUNNER_TEMP/mcfpm"
          chmod +x "$RUNNER_TEMP/mcfpm/bin/mcfpm" "$RUNNER_TEMP/mcfpm/runtime/bin/"*

      - name: Audit and freeze every legally publishable legacy entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/audit-migration-batch.mjs \
            --manifest .github/migrations/legacy-wheel-v1.json \
            --mcfpm "$RUNNER_TEMP/mcfpm/bin/mcfpm" \
            --output-directory "$RUNNER_TEMP/migration-candidates" \
            --report "$RUNNER_TEMP/migration-audit.json"

      - name: Summarize the no-secret audit
        run: |
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/migration-audit.json"));
            const manifest = JSON.parse(fs.readFileSync(".github/migrations/legacy-wheel-v1.json"));
            const lines = [
              "## Legacy wheel migration audit",
              "",
              `- Passed: ${report.passedCount}`,
              `- Failed CLI audit: ${report.failedCount}`,
              `- Blocked before download (license/version/source): ${manifest.blockedCount}`,
              "",
              "No Nexus credential was available to this job.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload frozen candidates and audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-wheel-v1-candidates
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/migration-candidates/*
            ${{ runner.temp }}/migration-audit.json

  publish:
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: nexus-production
    steps:
      - name: Checkout trusted master publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Download candidates frozen by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: legacy-wheel-v1-candidates
          path: ${{ runner.temp }}/legacy-wheel-v1

      - name: Download and verify the pinned Mcfpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCFPM_RELEASE_REPOSITORY: ${{ vars.MCFPM_RELEASE_REPOSITORY }}
          MCFPM_RELEASE_VERSION: ${{ vars.MCFPM_RELEASE_VERSION }}
          MCFPM_RELEASE_SHA256: ${{ vars.MCFPM_RELEASE_SHA256 }}
        run: |
          set -euo pipefail
          version="${MCFPM_RELEASE_VERSION#v}"
          archive="$RUNNER_TEMP/mcfpm-${version}-linux.zip"
          gh release download "v${version}" --repo "$MCFPM_RELEASE_REPOSITORY" \
            --pattern "mcfpm-${version}-linux.zip" --dir "$RUNNER_TEMP"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$actual" == "${MCFPM_RELEASE_SHA256,,}" ]]
          unzip -q "$archive" -d "$RUNNER_TEMP/mcfpm"
          chmod +x "$RUNNER_TEMP/mcfpm/bin/mcfpm" "$RUNNER_TEMP/mcfpm/runtime/bin/"*

      - name: Publish frozen packages and their site metadata
        env:
          NEXUS_REPOSITORY_URL: ${{ vars.NEXUS_REPOSITORY_URL }}
          NEXUS_REPOSITORY_NAME: ${{ vars.NEXUS_REPOSITORY_NAME }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-migration-batch.mjs \
            --manifest .github/migrations/legacy-wheel-v1.json \
            --audit-report "$RUNNER_TEMP/legacy-wheel-v1/migration-audit.json" \
            --artifact-directory "$RUNNER_TEMP/legacy-wheel-v1/migration-candidates" \
            --mcfpm "$RUNNER_TEMP/mcfpm/bin/mcfpm" \
            --repository-url "$NEXUS_REPOSITORY_URL" \
            --repository-name "$NEXUS_REPOSITORY_NAME" \
            --report "$RUNNER_TEMP/migration-publish.json"

      - name: Summarize publication
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/migration-publish.json" ]]; then
            node -e '
              const fs = require("fs");
              const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/migration-publish.json"));
              const lines = [
                "## Legacy wheel Nexus publication",
                "",
                `- Published/already present: ${report.publishedCount}`,
                `- Failed: ${report.failedCount}`,
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          fi

      - name: Upload publication report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-wheel-v1-publication
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/migration-publish.json
